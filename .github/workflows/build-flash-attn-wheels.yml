name: Mirror Wheels for flash-attn

# flash-attn ships no cp313 CUDA wheel on PyPI, and the only prebuilt wheels live on
# third-party GitHub releases (kingbri1 for Windows, mjun0812 for Linux x64). Pulling a
# 100+ MB asset straight from those releases at install time is flaky for end users:
# the download drops and pip lands a 0-byte file, failing with "Wheel is invalid".
# This workflow mirrors the upstream prebuilt wheels for visibility, then they get
# uploaded to the public.voxta.ai/voxta-python-wheels blob like every other wheel here.
# No compilation - we just re-host the upstream prebuilt wheels.

on:
  push:
    tags:
      - 'flash-attn-*'

jobs:
  mirror-and-release:
    runs-on: ubuntu-latest

    steps:
    - name: Download prebuilt flash-attn wheels
      shell: bash
      run: |
        mkdir -p dist
        curl -fSL -o "dist/flash_attn-2.8.3+cu128torch2.9.0cxx11abiFALSE-cp313-cp313-win_amd64.whl" \
          "https://github.com/kingbri1/flash-attention/releases/download/v2.8.3/flash_attn-2.8.3+cu128torch2.9.0cxx11abiFALSE-cp313-cp313-win_amd64.whl"
        curl -fSL -o "dist/flash_attn-2.8.3+cu128torch2.9-cp313-cp313-linux_x86_64.whl" \
          "https://github.com/mjun0812/flash-attention-prebuild-wheels/releases/download/v0.9.0/flash_attn-2.8.3+cu128torch2.9-cp313-cp313-linux_x86_64.whl"

    - name: Verify wheels are valid zips
      shell: bash
      working-directory: dist
      run: |
        for whl in *.whl; do
          echo "Checking $whl"
          python -c "import zipfile, sys; sys.exit(0 if zipfile.is_zipfile('$whl') else 1)"
        done

    - name: Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        draft: true
        files: dist/*.whl
